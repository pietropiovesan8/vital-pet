<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitalPet - Agendar Consulta</title>
  <style>
    /* Estilos das Especialidades */
    .especialidades-container {
      font-family: Arial, sans-serif;
      margin-top: 20px;
    }

    .titulo-especialidade {
      color: #0b499d;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .options-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Esconde o rádio padrão */
    .options-group input[type="radio"] {
      display: none;
    }

    /* Estilo dos botões/pílulas */
    .options-group label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 18px;
      min-height: 32px;
      box-sizing: border-box;
      border: 2px solid #0b499d;
      border-radius: 10px;
      color: #0b499d;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    /* Efeito ao passar o mouse */
    .options-group label:hover {
      background-color: #f0f4fa;
    }

    /* Item Selecionado */
    .options-group input[type="radio"]:checked + label {
      background-color: #0b499d;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div id="cabecalho">
      <div id="cantoesquerdoCab">
        <img src="" alt="logotipo" id="logotipo" />
        <h2 id="vitalpet">VitalPet</h2>
        <p id="subtitulo">Cuidado especializado para o seu melhor amigo</p>
      </div>
      <div id="meioCab">
        <nav>
          <ul>
            <u><li>Início</li></u>
            <li>Login</li>
            <li>Cadastre-se</li>
            <li>Loja</li>
          </ul>
        </nav>
        <input type="text" id="pesquisa" />
      </div>
      <div id="cantodireitoCab">
        <img src="" alt="profilepic" id="fotoperfil" />
        <p>Fale Conosco</p>
      </div>
    </div>
  </header>

  <article>
    <div id="mainbox">
      <div id="tituloAgendar">
        <h1>Agendar Consulta</h1>
      </div>

      <div id="formatoConsulta">
        <input type="checkbox" value="teleconsulta" id="teleconsulta" />
        <label for="teleconsulta">Teleconsulta</label>
        <input type="checkbox" value="presencial" id="presencial" />
        <label for="presencial">Presencial</label>
        <input type="checkbox" value="domiciliar" id="domiciliar" />
        <label for="domiciliar">Consulta Domiciliar</label>
      </div>

      <!-- SEÇÃO DE ESPECIALIDADES ADICIONADA -->
      <div class="especialidades-container">
        <div class="titulo-especialidade">Especialidade:</div>
        
        <div class="options-group">
          <input type="radio" id="clinica" name="especialidade" value="Clinica Médica" checked>
          <label for="clinica">Clinica Médica</label>

          <input type="radio" id="dermatologia" name="especialidade" value="Dermatologia">
          <label for="dermatologia">Dermatologia</label>

          <input type="radio" id="cardiologia" name="especialidade" value="Cardiologia">
          <label for="cardiologia">Cardiologia</label>

          <input type="radio" id="oftalmologia" name="especialidade" value="Oftalmologia">
          <label for="oftalmologia">Oftalmologia</label>

          <input type="radio" id="odontologia" name="especialidade" value="Odontologia">
          <label for="odontologia">Odontologia</label>

          <input type="radio" id="ortopedia" name="especialidade" value="Ortopedia">
          <label for="ortopedia">Ortopedia</label>

          <input type="radio" id="oncologia" name="especialidade" value="Oncologia">
          <label for="oncologia">Oncologia</label>

          <input type="radio" id="nefrologia" name="especialidade" value="Nefrologia">
          <label for="nefrologia">Nefrologia</label>
        </div>
      </div>

    </div>
  </article>

</body>
</html>
