<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Consulta - VitalPet</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background-color: #FFFDE7; }

    /* Faixa Azul Superior */
    .header-bg { background-color: #0F52BA; height: 120px; width: 100%; }

    /* Container Principal */
    .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

    /* Barra Superior Flutuante */
    .navbar {
      background: white;
      border-radius: 20px;
      padding: 10px 20px;
      margin-top: -50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .logo { font-size: 20px; font-weight: bold; color: #F89E1B; }
    .logo span { color: #0F52BA; }
    .nav-links a { margin: 0 10px; text-decoration: none; color: #333; font-weight: bold; }
    .btn-fale { background: #F89E1B; color: white; border: none; padding: 8px 15px; border-radius: 15px; font-weight: bold; }

    /* Card do Formulário Central */
    .card-form {
      background: white;
      border-radius: 15px;
      margin-top: 30px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .card-header {
      background: #0b499d;
      color: white;
      padding: 15px 25px;
      font-size: 22px;
      font-weight: bold;
    }
    .card-body { padding: 25px; }

    /* Seções do Formulário */
    .section-title { font-weight: bold; color: #0b499d; margin-bottom: 8px; }
    .checkbox-group { display: flex; gap: 15px; margin-bottom: 20px; font-size: 14px; font-weight: bold; }
    
    /* Estilos das Especialidades */
        .especialidades-container {
            font-family: Arial, sans-serif;
            margin-top: 20px;
        }

        .titulo-especialidade {
            color: #0b499d;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Esconde o rádio padrão */
        .options-group input[type="radio"] {
            display: none;
        }

        /* Estilo dos botões/pílulas */
        .options-group label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 18px;
            min-height: 32px;
            box-sizing: border-box;
            border: 2px solid #0b499d;
            border-radius: 10px;
            color: #0b499d;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        /* Efeito ao passar o mouse */
        .options-group label:hover {
            background-color: #f0f4fa;
        }

        /* Item Selecionado */
        .options-group input[type="radio"]:checked+label {
            background-color: #0b499d;
            color: #ffffff;
        }

    /* Caixa Cinza de Alerta */
    .alert-box {
      background: #E0E0E0;
      padding: 20px;
      border-radius: 10px;
      font-size: 13px;
      color: #333;
      margin-bottom: 25px;
    }

    /* Botão Principal de Agendar */
    .btn-submit {
      display: block;
      margin: 0 auto;
      background: #FFA726;
      color: white;
      border: none;
      padding: 12px 35px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:hover{
        background-color: #ca861f;
    }
    .btn-fale:hover{
        background-color: #ca861f;
        cursor: pointer;
    }
    @media (max-width: 600px) {
  /* Ajusta o padding do container em telas pequenas */
  .container {
    padding: 0 10px;
  }

  /* Faz a barra de navegação empilhar os elementos se a tela for muito estreita */
  .navbar {
    flex-direction: column;
    gap: 10px;
    text-align: center;
  }

  /* Ajusta os botões das especialidades para preencherem a largura */
  .chip {
    flex: 1 1 calc(50% - 10px); /* Exibe 2 por linha em telas pequenas */
    text-align: center;
  }
}
  </style>
</head>
<body>

  <div class="header-bg"></div>

  <div class="container">
    <div class="navbar">
      <div class="logo">Vital<span>Pet</span></div>
      <nav class="nav-links">
        <a href="#" style="color:#FFA726; border-bottom: 2px solid #FFA726;">Início</a>
        <a href="#">Login</a>
        <a href="#">Cadastre-se</a>
        <a href="#">Loja</a>
      </nav>
      <button class="btn-fale">📞 Fale Conosco</button>
    </div>

    <div class="card-form">
      <div class="card-header">Agendar Consulta</div>
      <div class="card-body">

        <div class="section-title">Formato da Consulta:</div>
        <div class="checkbox-group">
          <label><input type="checkbox" checked> Teleconsulta</label>
          <label><input type="checkbox"> Presencial</label>
          <label><input type="checkbox"> Consulta Domiciliar</label>
        </div>

        <div class="especialidades-container">
                <div class="titulo-especialidade">Especialidade:</div>

                <div class="options-group">
                    <input type="radio" id="clinica" name="especialidade" value="Clinica Médica" checked>
                    <label for="clinica">Clinica Médica</label>

                    <input type="radio" id="dermatologia" name="especialidade" value="Dermatologia">
                    <label for="dermatologia">Dermatologia</label>

                    <input type="radio" id="cardiologia" name="especialidade" value="Cardiologia">
                    <label for="cardiologia">Cardiologia</label>

                    <input type="radio" id="oftalmologia" name="especialidade" value="Oftalmologia">
                    <label for="oftalmologia">Oftalmologia</label>

                    <input type="radio" id="odontologia" name="especialidade" value="Odontologia">
                    <label for="odontologia">Odontologia</label>

                    <input type="radio" id="ortopedia" name="especialidade" value="Ortopedia">
                    <label for="ortopedia">Ortopedia</label>

                    <input type="radio" id="oncologia" name="especialidade" value="Oncologia">
                    <label for="oncologia">Oncologia</label>

                    <input type="radio" id="nefrologia" name="especialidade" value="Nefrologia">
                    <label for="nefrologia">Nefrologia</label>
                </div>
            </div>

        <div class="alert-box" style="margin: 15px;">
          🚨 <b>Atenção:</b> Em casos de emergência ou urgência (como dificuldades para respirar, acidentes, falta de ar ou impossibilidade de urinar), procure atendimento presencial imediato.
        </div>

        <button class="btn-submit">Agendar sua Consulta!</button>

      </div>
    </div>
  </div>

</body>
</html>
