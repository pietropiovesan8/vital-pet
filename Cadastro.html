<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - VitalPet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background-image: url('foto_fundo.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bloco_1 {
            background-color: #EFE6D5;
            border: 3px solid #E0913E;
            border-radius: 25px;
            padding: 25px;
            width: 340px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #000;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            width: 248px;
            height: 38px;
            border-radius: 8px;
            padding: 0 12px;
            border: 2px solid #3B6BB0;
            background-color: #EFE6D5;
            margin-bottom: 12px;
            font-size: 0.85rem;
            outline: none;
        }

        label {
            display: flex;
            justify-content: left;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-style: initial;
            margin: 5px;
            margin-left: 2px;
        }

        #cadastrar {
            width: 60%;
            height: 40px;
            border-radius: 15px;
            background-color: #FF9425;
            border: 2px solid #FF9425;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 6px 6px rgba(0, 0, 0, 0.443);
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }

        #cadastrar:hover {
            color: #000;
            border: 2px solid #FF9425;
            background-color: #ffffff;
        }

        #msg {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
            min-height: 20px;
        }

        #frase {
            font-size: medium;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: 800;
            color: #000;
            line-height: 1.3;
        }
        @media (max-width: 480px) {
           .corpo {
            background-image: url('fundo_celular.jpeg'); 
             }
            #bloco_1 {
                padding: 20px 16px;
                border-radius: 20px;
            }
            h1 {
                font-size: 1.75rem;
                margin-bottom: 16px;
            }
            .opcoes {
                font-size: 0.72rem;
            }
            #frase {
                font-size: 0.85rem;
            }
}
    </style>
</head>

<body>
    <main id="caixa">
        <div id="bloco_1">
            <h1>Cadastro</h1>

            <form id="formCadastro">
                <div>
                    <label for="user">Nome completo:</label>
                    <input type="text" id="user" placeholder="Ex: Ana Letícia" required>
                </div>
                <div>
                    <label for="gmail">E-mail:</label>
                    <input type="email" id="gmail" placeholder="nome@exemplo.com" required>
                </div>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" required>
                </div>
                <div>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>
                <div>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" placeholder="00000-000" maxlength="9">
                </div>

                <!-- Elemento para exibir mensagens de Sucesso ou Erro -->
                <div id="msg"></div>

                <button id="cadastrar" type="submit">Cadastrar-se</button>
            </form>

            <p id="frase">Faça parte da família VitalPet e cuide<br>do seu melhor amigo !</p>
        </div>
    </main>

    <script>
        // COLE SUA URL DO GOOGLE APPS SCRIPT AQUI ABAIXO:
        const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbx2z3stVDshyfArYTKoVjoxPssxlkqMxpCF8KN18gmPGu9LsH1KM4kNOCsF4jJsyM1w/exec';

        document.getElementById('formCadastro').addEventListener('submit', function (e) {
            e.preventDefault(); // Impede o recarregamento da página

            const msg = document.getElementById('msg');
            const btn = document.getElementById('cadastrar');

            btn.disabled = true;
            msg.style.color = '#333';
            msg.innerText = "Enviando cadastro...";

            // Organiza os dados no formato que o Apps Script lê
            const params = new URLSearchParams();
            params.append('action', 'cadastrar');
            params.append('nome', document.getElementById('user').value);
            params.append('email', document.getElementById('gmail').value);
            params.append('senha', document.getElementById('senha').value);
            params.append('cpf', document.getElementById('cpf').value);
            params.append('cep', document.getElementById('cep').value);

            // Dispara a requisição HTTP POST
            fetch(URL_APPS_SCRIPT, {
                method: 'POST',
                body: params
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'sucesso') {
                    msg.style.color = 'green';
                    msg.innerText = data.mensagem;

                    // Aguarda 1.5 segundo e redireciona para a página de login
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    msg.style.color = 'red';
                    msg.innerText = data.mensagem;
                }
            })
            .catch(error => {
                msg.style.color = 'red';
                msg.innerText = "Erro ao conectar com o servidor! Tente novamente.";
            })
            .finally(() => {
                btn.disabled = false;
            });
        });
    </script>
</body>

</html>
