<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <main id="caixa">
        <div id="bloco_1">
            <h1>Cadastro</h1>

            <form>
                <div> 
                <label for ="user">Nome completo:</label>
                <input type="text" id="user" placeholder=" Ex: Ana Letícia">
                </div>
                <div>
                <label for ="gmail">E-mail:</label>
                 <input type="email" id="gmail" placeholder=" nome@exemplo.com">
                </div>
                <div>
                <label for ="senha"> Senha:</label>
                <input type="password" id="senha">
                </div>
                <div>
                 <label for ="cpf">CPF:</label>
                 <input type="email" id="cpf" placeholder="00000000000">
                </div>
                 <div>
                 <label for ="cep"> CEP:</label>
                 <input type="number" id="cep" placeholder ="00000-000">
                </div>
                <button id="cadastrar" type="button">Cadastrar-se</button>
            </form>
            <p id="frase">Faça parte da família VitalPet e cuide<br>do seu melhor amigo !</p>
        </div>
     </main>
</body>

</html>
