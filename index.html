<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pet Shop</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="conteiner">
        <div class="card">
            <h1>LOGIN</h1>
            
            <form id="formLogin" onsubmit="validarEEntrar(event)">
                <label for="user">Usuário:</label>
                <input type="email" id="user" placeholder="Email" required>
                <label for="pass">Senha:</label>
                <input type="password" id="pass" placeholder="**********" required>
                
                <button type="submit" class="btn-entrar">Entrar</button>
                
                <a href="#" class="link-esqueci">Esqueci minha senha.</a>
                <!-- Linha única e contínua -->
                <div class="texto-cadastro">
                    <span>Não tem conta?</span>
                    <a href="cadastro.html">Clique aqui!</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        function validarEEntrar(event) {
            event.preventDefault();
            const email = document.getElementById('user').value.trim();
            const senha = document.getElementById('pass').value.trim();
            if (email !== "" && senha !== "") {
                window.location.href = "dashboard.html";
            } else {
                alert("Por favor, preencha todos os campos antes de entrar.");
            }
        }
    </script>
</body>
</html>
